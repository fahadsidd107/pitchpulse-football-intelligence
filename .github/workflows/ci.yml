name: Verify workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@11.25.0
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check
      - name: Start local infrastructure
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 180
      - name: Start API and wait for readiness
        run: |
          cargo build --locked -p pitchpulse-api
          ./target/debug/pitchpulse-api > /tmp/pitchpulse-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web test:e2e
      - name: Stop infrastructure
        if: always()
        run: docker compose down
