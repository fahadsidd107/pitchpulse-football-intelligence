[workspace]
members = ["apps/api", "apps/ingest-worker", "apps/event-consumer", "apps/job-worker", "crates/shared", "crates/domain", "crates/application", "crates/infrastructure"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tower-http = { version = "=0.6.11", features = ["cors", "trace", "request-id", "limit"] }
tower = { version = "=0.5.3", features = ["util"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
dotenvy = "=0.15.7"
url = "=2.5.8"
uuid = { version = "=1.29.0", features = ["v4"] }
